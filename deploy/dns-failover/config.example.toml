# Example config for nebula-dns-failover
#
# Secrets (never commit real values):
#   NEBULA_API_TOKEN     — NebulaDNS record API bearer (provider.type = "nebuladns")
#   CF_API_TOKEN         — Cloudflare Zone.DNS Edit (provider.type = "cloudflare")
#   FAILOVER_API_TOKEN   — protects POST /v1/hostnames/... break-glass endpoints
#
# Pilot hostname: abtesting.fictionally.org
# Primary lon1 195.20.255.201 / Secondary lon2 85.190.106.189

listen = "127.0.0.1:9119"
dry_run = true
interval = "10s"
probe_timeout = "3s"
consecutive_fail = 3
consecutive_ok = 3
# failback_delay = "2m"
ttl = 30
require = "all"

[provider]
# Prefer NebulaDNS when this zone is authoritative here (fast record API, fail-closed).
type = "nebuladns"
api_base = "http://127.0.0.1:8080"
zone_name = "fictionally.org"
# api_token from NEBULA_API_TOKEN

# Cloudflare alternative (only when NebulaDNS is not authoritative for the zone):
# type = "cloudflare"
# zone_name = "fictionally.org"
# # zone_id = "..."
# # cf_api_token from CF_API_TOKEN

[pops.lon1]
display_name = "London lon1"
public_ipv4 = "195.20.255.201"
health_urls = ["https://lon1.pop0.uk/healthz"]

[pops.lon2]
display_name = "London lon2/pop0"
public_ipv4 = "85.190.106.189"
health_urls = ["https://lon2.pop0.uk/healthz"]

[[hostnames]]
name = "abtesting.fictionally.org"
mode = "active-passive"
primary = "lon1"
secondary = "lon2"
record_type = "A"
proxied = false
enabled = true

# Start with a non-production name before cutting over the pilot:
# [[hostnames]]
# name = "abtesting-failover-test.fictionally.org"
# mode = "active-passive"
# primary = "lon1"
# secondary = "lon2"
# record_type = "A"
# enabled = true
