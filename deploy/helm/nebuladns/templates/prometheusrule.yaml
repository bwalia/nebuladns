{{- if .Values.prometheusRule.enabled }}
# Alert groups come from rules/nebuladns.rules.yml, a copy of
# deploy/prometheus/nebuladns.rules.yml (CI fails if they drift). .Files.Get returns the
# file unrendered, so the rules' own $labels / $value templates pass through untouched.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "nebuladns.fullname" . }}
  labels:
    {{- include "nebuladns.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}{{ toYaml . | nindent 4 }}{{- end }}
spec:
  groups:
    {{- (.Files.Get "rules/nebuladns.rules.yml" | fromYaml).groups | toYaml | nindent 4 }}
{{- end }}
