{{- if .Values.grafanaDashboard.enabled }}
# Picked up by the Grafana sidecar (kube-prometheus-stack) via the grafana_dashboard label.
# Source of truth: deploy/docker/compose/grafana/dashboards/overview.json; CI fails if the
# chart copy drifts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nebuladns.fullname" . }}-dashboard
  labels:
    {{- include "nebuladns.labels" . | nindent 4 }}
    {{- with .Values.grafanaDashboard.labels }}{{ toYaml . | nindent 4 }}{{- end }}
  {{- with .Values.grafanaDashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  nebuladns-overview.json: |-
{{ .Files.Get "dashboards/nebuladns-overview.json" | indent 4 }}
{{- end }}
