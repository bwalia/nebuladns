; Target for tests/run.sh: a local systemd container reached with `docker exec`.
; DNS binds to the container's eth0 address, same path as a WireGuard/LAN host.
[nebuladns]
nebuladns-ansible-target ansible_connection=community.docker.docker nebuladns_dns_interface=eth0

[nebuladns:vars]
ansible_python_interpreter=/usr/bin/python3
