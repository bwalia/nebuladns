; Real inventory for NebulaDNS public nameservers.
; Nameserver IPs are public by design (they get published in NS / glue records).
;
; diy-tax-return-infra owns the operational inventory (group nebuladns_hosts)
; and SSH creds — see ../diy-tax-return-infra/ansible/nebuladns.yml.
; Keep this file aligned when IPs change.
;
; The deploy workflow also accepts DEPLOY_INVENTORY as a secret and writes it
; to deploy/ansible/inventory.ini at runtime.

[nebuladns]
ns1.nebuladns  ansible_host=72.62.211.28   ansible_user=bwalia
ns2.nebuladns  ansible_host=85.190.106.88  ansible_user=administrator

; Private/DTAP hosts: add nebuladns_dns_interface=wg0 (WireGuard IP) or =eth0 (LAN IP)
; per host and deploy with -e @environments/private.yml. See README.md.

[nebuladns:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_ssh_common_args='-o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20'
