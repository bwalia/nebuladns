global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerts from deploy/prometheus/nebuladns.rules.yml (see http://localhost:9091/alerts).
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: nebuladns
    static_configs:
      - targets:
          - nebuladns:9090
